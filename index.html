<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>KCC Heating and Cooling - MMai Report</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background:#f4f6f9;color:#1a1a2e}.wrapper{max-width:860px;margin:0 auto;padding:32px 16px 64px}.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);border-radius:16px;padding:40px 40px 32px;margin-bottom:24px;color:#fff}.header-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}.brand{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#e94560;margin-bottom:10px}.client-name{font-size:28px;font-weight:800;line-height:1.2}.report-badge{background:#e94560;color:#fff;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;align-self:flex-start}.cadence-bar{margin-top:20px;background:rgba(255,255,255,.08);border-radius:10px;padding:14px 20px;display:flex;gap:32px;flex-wrap:wrap}.cadence-item{font-size:12px;color:rgba(255,255,255,.6)}.cadence-item span{display:block;font-size:14px;font-weight:600;color:#fff;margin-top:2px}.validation{background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:24px;border-left:4px solid #0f3460;font-size:13px;line-height:1.8;color:#444}.validation strong{color:#1a1a2e}.section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#e94560;margin-bottom:12px}.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:24px}.stat-card{background:#fff;border-radius:12px;padding:18px 16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}.stat-card .val{font-size:28px;font-weight:800;color:#0f3460;line-height:1}.stat-card .lbl{font-size:11px;color:#888;margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}.stat-card.warn .val{color:#f59e0b}.seq-section{margin-bottom:28px}.seq-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:16px}.seq-header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:1px solid #f0f0f0}.seq-name{font-size:15px;font-weight:700;color:#1a1a2e}.seq-meta{font-size:11px;color:#888;margin-top:2px}.badge-active{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;background:#d1fae5;color:#065f46}.seq-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.seq-stat{padding:14px 16px;border-right:1px solid #f0f0f0;border-top:1px solid #f0f0f0}.seq-stat .s-val{font-size:20px;font-weight:700;color:#0f3460}.seq-stat .s-lbl{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}.seq-stat.amber .s-val{color:#f59e0b}.seq-stat.green .s-val{color:#059669}.insights{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,.05)}.insight-item{display:flex;gap:14px;margin-bottom:16px;align-items:flex-start}.insight-item:last-child{margin-bottom:0}.insight-icon{font-size:20px;flex-shrink:0;margin-top:1px}.insight-text{font-size:14px;line-height:1.6;color:#444}.insight-text strong{color:#1a1a2e}.next-steps{background:linear-gradient(135deg,#0f3460,#16213e);border-radius:12px;padding:24px;color:#fff;margin-bottom:24px}.next-steps .section-title{color:rgba(255,255,255,.5)}.step-item{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}.step-item:last-child{margin-bottom:0}.step-num{background:#e94560;color:#fff;font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}.step-text{font-size:14px;line-height:1.6;color:rgba(255,255,255,.85)}.step-text strong{color:#fff}.footer{text-align:center;font-size:12px;color:#aaa;margin-top:32px}.footer strong{color:#e94560}.loading{text-align:center;padding:80px 20px;color:#888;font-size:16px}.error-msg{background:#fff0f0;border-left:4px solid #e94560;border-radius:8px;padding:16px 20px;color:#c0392b;font-size:13px}</style></head><body><div class="wrapper" id="app"><div class="loading">Loading report data...</div></div><script>var DATA_URL='data/report.json';function kpiCard(k){return'<div class="stat-card '+(k.style==='warn'?'warn':'')+'"><div class="val">'+k.value+'</div><div class="lbl">'+k.label+'</div></div>';}function seqStat(s){return'<div class="seq-stat '+(s.style!=='default'?s.style:'')+'"><div class="s-val">'+s.value+'</div><div class="s-lbl">'+s.label+'</div></div>';}function seqCard(q){return'<div class="seq-card"><div class="seq-header"><div><div class="seq-name">'+q.name+'</div><div class="seq-meta">'+q.meta+'</div></div><span class="badge-active">Active</span></div><div class="seq-stats">'+q.stats.map(seqStat).join('')+'</div></div>';}function render(d){var m=d.meta;document.title=m.client+' - MMai Report #'+m.report_number;var vRows=d.validation.map(function(v){return'&bull; <strong>'+v.label+':</strong> '+v.value;}).join('<br>');var activeOnly=d.sequences.active.filter(function(q){return q.status==='active';});document.getElementById('app').innerHTML='<div class="header"><div class="header-top"><div><div class="brand">'+m.brand+'</div><div class="client-name">'+m.client+'</div></div><div class="report-badge">Report #'+m.report_number+' &mdash; '+m.report_label+'</div></div><div class="cadence-bar"><div class="cadence-item">Period<span>'+m.period_display+'</span></div><div class="cadence-item">Type<span>'+m.report_label+'</span></div><div class="cadence-item">Next Report<span>'+m.next_report+'</span></div><div class="cadence-item">Prosp / LinkedIn<span>'+m.prosp+'</span></div><div class="cadence-item">Meetings<span>'+m.meetings+'</span></div></div></div>'+'<div class="validation"><strong>Run Validation:</strong><br>'+vRows+'</div>'+'<div class="section-title">All-Time Aggregate &mdash; Active Sequences</div>'+'<div class="stat-grid">'+d.kpis.map(kpiCard).join('')+'</div>'+'<div class="seq-section"><div class="section-title">Active Sequences ('+activeOnly.length+')</div>'+activeOnly.map(seqCard).join('')+'</div>'+'<div class="insights"><div class="section-title">Baseline Insights</div>'+d.insights.map(function(i){return'<div class="insight-item"><div class="insight-icon">'+i.icon+'</div><div class="insight-text">'+i.text+'</div></div>';}).join('')+'</div>'+'<div class="next-steps"><div class="section-title">Recommended Actions</div>'+d.actions.map(function(a){return'<div class="step-item"><div class="step-num">'+a.num+'</div><div class="step-text">'+a.text+'</div></div>';}).join('')+'</div>'+'<div class="footer">'+d.footer+'</div>';}fetch(DATA_URL).then(function(r){if(!r.ok)throw new Error('Failed to load report data ('+r.status+')');return r.json();}).then(render).catch(function(err){document.getElementById('app').innerHTML='<div class="error-msg">Could not load report data: '+err.message+'</div>';});</script></body></html>
